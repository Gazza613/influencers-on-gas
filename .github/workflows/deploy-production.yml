name: Deploy to production

# Every push to main deploys to Vercel production and moves studio.gasmarketing.co.za to it -
# so a push always goes live, no manual `vercel --prod` and nothing to wonder about (Gary).
# One-time setup: add a VERCEL_TOKEN secret (Settings > Secrets and variables > Actions). The
# org/project IDs below are not secret. Until the token is set, this workflow is a green no-op.
on:
  push:
    branches: [main]

# Only the newest push deploys; a run in progress is cancelled when a newer commit lands, so the
# live domain always ends on the latest commit rather than whichever build happened to finish last.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_1829wAqE7KrHtYSr8oRQKI1A
      VERCEL_PROJECT_ID: prj_ge0vGZ1onLMAj92OWF46hlwSuGVr
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Gate on token
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not set yet. Add it in Settings > Secrets and variables > Actions to turn on auto-deploy. Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        if: steps.gate.outputs.go == 'true'
        run: npm install -g vercel@latest

      - name: Deploy to production
        if: steps.gate.outputs.go == 'true'
        run: |
          # Pull the project's production env (DATABASE_URL, keys, etc.) so the build matches production.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          # --prod aliases the production domain (studio.gasmarketing.co.za) automatically.
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "::notice::Live on production: $url (studio.gasmarketing.co.za updated)"
          echo "### ✅ Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url · studio.gasmarketing.co.za" >> "$GITHUB_STEP_SUMMARY"
